[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "ipyregulartable"
authors = [
    {name = "The ipyregulartable authors", email = "t.paine154@gmail.com"},
]
description = "An AnyWidget wrapper around regular-table powered by spaday"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.3.7"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "numpy",
    "pandas>=3.0.6",
    "spaday[widget]>=0.13,<1.0",
    "spaday-regular-table>=0.3,<1.0",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatchling",
    "jupyterlab>=4,<5",
    "mdformat",
    "mdformat-frontmatter",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/finos/ipyregulartable"
Homepage = "https://github.com/finos/ipyregulartable"

[tool.bumpversion]
current_version = "0.3.7"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "ipyregulartable/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "binder/requirements.txt"
search = 'ipyregulartable=={current_version}'
replace = 'ipyregulartable=={new_version}'

[tool.coverage.run]
branch = true
omit = [
    "ipyregulartable/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "ipyregulartable",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ipyregulartable",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "ipyregulartable/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "ipyregulartable",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]
